server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/securex
spring.datasource.username=root
spring.datasource.password=Arpit@123

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=TRACE

#jjwt security token
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.access-token-seconds=${JWT_ACCESS_TOKEN}
security.jwt.refresh-token-seconds=${REFRESH_TOKEN_SECOUND}
security.jwt.refresh-token-cookie-name=${REFRESH_TOKEN_COOKIE_NAME}
security.jwt.cookie-secure=${COOKIE_SECURE}
security.jwt.http-only=${JWT_COOKIE_HTTP_ONLY}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE}
security.jwt.cookie-domain=${COOKIE_DOMAIN}

spring.security.oauth2.client.registration.google.client-id=${YOUR_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${YOUR_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.frontend-success-redirect=http://localhost:5173/oauth2/success
app.oauth2.frontend-failure-redirect=http://localhost:5173/oauth2/failure

cors.frontend-url=http://localhost:5173